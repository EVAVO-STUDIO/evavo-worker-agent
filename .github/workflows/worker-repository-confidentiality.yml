name: Worker repository confidentiality

on:
  push:
    branches: [main]
    paths:
      - "scripts/check-worker-repository-visibility.mjs"
      - "docs/worker-repository-confidentiality.md"
      - "package.json"
      - "scripts/check-safety-gate-completeness.mjs"
      - "scripts/check-helper-scripts.mjs"
      - ".github/workflows/worker-repository-confidentiality.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/check-worker-repository-visibility.mjs"
      - "docs/worker-repository-confidentiality.md"
      - "package.json"
      - "scripts/check-safety-gate-completeness.mjs"
      - "scripts/check-helper-scripts.mjs"
      - ".github/workflows/worker-repository-confidentiality.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-repository-confidentiality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visibility:
    name: Verify private repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Verify live repository confidentiality
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-worker-repository-visibility.mjs --live
