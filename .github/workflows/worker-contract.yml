name: Worker contract

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - "**/*.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/worker-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - "**/*.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/worker-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Worker deterministic contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Worker workflow parity
        run: node scripts/check-worker-contract-workflow.mjs

      - name: Verify read-only health contract
        run: node scripts/check-worker-health-contract.mjs

      - name: Verify README top-level truthfulness
        run: npm run docs:readme-truthfulness:check

      - name: Verify public research fetch boundary
        run: npm run research:public-fetch-safety:check

      - name: Run complete Worker local gate
        run: npm run check:local
