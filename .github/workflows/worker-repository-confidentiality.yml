name: Worker repository confidentiality

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to validate
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: worker-confidentiality-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  confidentiality:
    name: Confirm private repository posture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs

      - name: Verify live private repository posture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-worker-repository-visibility.mjs --live

      - name: Record confidentiality receipt
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          mkdir -p diagnostics
          printf '{"schemaVersion":"1.0","repository":"EVAVO-STUDIO/evavo-worker-agent","sha":"%s","workflow":"worker-repository-confidentiality.yml","permission":"contents-read","repositoryMutation":"disabled"}\n' "$EXPECTED_SHA" > diagnostics/worker-confidentiality-receipt.json

      - name: Upload bounded confidentiality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-confidentiality-${{ inputs.expected_sha }}
          path: diagnostics/worker-confidentiality-receipt.json
          if-no-files-found: error
          retention-days: 14
