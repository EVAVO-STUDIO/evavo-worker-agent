version: 2
updates:
  # Routine dependency updates are collected by Development Studio and tested
  # against the worker's exact Node, package-manager, Cloudflare and provider
  # cohort. GitHub security updates remain separate and are never auto-merged.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    rebase-strategy: disabled
    labels:
      - dependencies
      - security
    commit-message:
      prefix: deps
      include: scope

  # Action runtime updates remain governed toolchain migrations.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    labels:
      - dependencies
      - security
    commit-message:
      prefix: ci
      include: scope
