name: Growth operating policy

on:
  push:
    branches:
      - main
    paths:
      - "src/core/growthOperatingPolicy.ts"
      - "fixtures/growth-operating-policy-v1.json"
      - "tests/growthOperatingPolicy.test.ts"
      - "scripts/check-growth-operating-policy.mjs"
      - "docs/growth-operating-policy.md"
      - ".github/workflows/growth-operating-policy.yml"
  pull_request:
    paths:
      - "src/core/growthOperatingPolicy.ts"
      - "fixtures/growth-operating-policy-v1.json"
      - "tests/growthOperatingPolicy.test.ts"
      - "scripts/check-growth-operating-policy.mjs"
      - "docs/growth-operating-policy.md"
      - ".github/workflows/growth-operating-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-growth-operating-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-contract:
    name: Worker zero-cost policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Growth operating policy
        run: node scripts/check-growth-operating-policy.mjs

      - name: Run core tests
        run: npm run test:core

      - name: Typecheck
        run: npm run typecheck
