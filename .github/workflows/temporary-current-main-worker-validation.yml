name: Temporary current-main Worker validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/temporary-current-main-worker-validation.yml"

permissions:
  contents: write

concurrency:
  group: temporary-current-main-worker-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'EVAVO-STUDIO'
    name: Validate current main Worker fixes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare candidate
        shell: bash
        run: |
          python scripts/prepare-current-main-worker-fixes.py
          python scripts/refine-current-main-worker-fixes.py

      - name: Validate candidate
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          failed=0

          run_check() {
            label="$1"
            shift
            log="diagnostics/${label}.log"
            "$@" >"$log" 2>&1
            code=$?
            printf '%s\n' "$code" >"diagnostics/${label}.status"
            if [ "$code" -ne 0 ]; then
              failed=1
              echo "FAIL $label"
            else
              echo "PASS $label"
            fi
          }

          run_check helper-guard node scripts/check-helper-scripts.mjs
          run_check source-secret node scripts/check-worker-source-secrets.mjs
          run_check safety-completeness node scripts/check-safety-gate-completeness.mjs
          run_check readme-truthfulness node scripts/check-readme-top-level-truthfulness.mjs
          run_check operating-posture node scripts/check-readme-operating-posture.mjs
          run_check repository-visibility-static node scripts/check-worker-repository-visibility.mjs
          run_check broad-admin node scripts/check-broad-admin-write-safety.mjs
          run_check autonomy-capability node scripts/check-autonomy-capability-truthfulness.mjs
          run_check historical-compatibility node scripts/check-historical-data-compatibility.mjs
          run_check activity-budget node scripts/check-growth-activity-budget.mjs
          run_check zero-cost node scripts/check-growth-zero-cost-envelope.mjs
          run_check route-parity node scripts/check-growth-route-parity.mjs
          run_check worker-workflow node scripts/check-worker-contract-workflow.mjs
          run_check focused-tests npm run test:core -- \
            tests/growthActivityBudgetSettings.test.ts \
            tests/growthActivityBudgetSource.test.ts \
            tests/growthInternalOperatorPackRouteSource.test.ts \
            tests/growthRouteParitySource.test.ts \
            tests/growthZeroCostEnvelope.test.ts \
            tests/opportunitySourceHealthActionsSource.test.ts
          run_check core-tests npm run test:core
          run_check backend-aggregate npm run growth:backend:aggregate:check
          run_check local-gate npm run check:local
          run_check typecheck npm run typecheck

          git diff --name-only | sort > diagnostics/candidate-files.txt
          git diff --stat > diagnostics/candidate-stat.txt
          git diff > diagnostics/candidate.patch

          {
            echo "validated_main_sha=${{ github.event.pull_request.base.sha }}"
            echo "validation_failed=$failed"
            for status in diagnostics/*.status; do
              printf '%s=%s\n' "$(basename "$status" .status)" "$(cat "$status")"
            done
          } | tee diagnostics/summary.txt
          exit "$failed"

      - name: Publish clean validated commits
        if: steps.diagnostics.outcome == 'success'
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLISH_BRANCH: validated/current-main-worker-fixes-${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"

          publish="$RUNNER_TEMP/current-main-worker-publish"
          git worktree add --detach "$publish" origin/main
          python "$GITHUB_WORKSPACE/scripts/prepare-current-main-worker-fixes.py" "$publish"
          python "$GITHUB_WORKSPACE/scripts/refine-current-main-worker-fixes.py" "$publish"
          cd "$publish"
          git switch -c "$PUBLISH_BRANCH"

          expected="$(sort -u "$GITHUB_WORKSPACE/scripts/current-main-worker-fix-files.txt")"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/core/growthZeroCostEnvelope.ts scripts/check-growth-zero-cost-envelope.mjs
          git commit -m "Fix Growth zero-cost safety floor evaluation"

          git add \
            docs/manual-research-concurrency.md \
            scripts/check-growth-activity-budget.mjs \
            src/core/growthCapabilities.ts \
            tests/growthActivityBudgetSettings.test.ts \
            tests/growthActivityBudgetSource.test.ts \
            tests/growthInternalOperatorPackRouteSource.test.ts
          git commit -m "Align Growth activity contracts with live runtime"

          git add \
            scripts/check-autonomy-capability-truthfulness.mjs \
            scripts/check-broad-admin-write-safety.mjs \
            scripts/check-growth-route-parity.mjs \
            scripts/check-helper-scripts.mjs \
            scripts/check-historical-data-compatibility.mjs \
            scripts/check-readme-operating-posture.mjs \
            scripts/check-worker-source-secrets.mjs \
            tests/growthRouteParitySource.test.ts
          git commit -m "Align Worker safety guards with bounded runtime"

          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          {
            echo "publish_branch=$PUBLISH_BRANCH"
            echo "parent_sha=$(git rev-parse HEAD^^^)"
            echo "final_sha=$(git rev-parse HEAD)"
            echo "changed_files<<EOF"
            printf '%s\n' "$actual"
            echo "EOF"
          } | tee "$GITHUB_WORKSPACE/diagnostics/published-commit.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-main-worker-validation
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Fail when validation failed
        if: always()
        shell: bash
        run: |
          test -f diagnostics/summary.txt
          grep -q '^validation_failed=0$' diagnostics/summary.txt
