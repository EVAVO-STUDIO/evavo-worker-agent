name: Growth fallback safety

on:
  push:
    branches: [main]
    paths:
      - "src/core/growthAudit.ts"
      - "src/core/growthBrief.ts"
      - "src/routes/growthAdmin.ts"
      - "src/routes/growthAdminProtected.ts"
      - "src/core/boundedJsonRequest.ts"
      - "src/core/adminAuthentication.ts"
      - "tests/growthAdminFallbackSafety.test.ts"
      - "tests/growthAuditSummary.test.ts"
      - "scripts/check-growth-subhandler-auth-safety.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/growth-fallback-safety.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/core/growthAudit.ts"
      - "src/core/growthBrief.ts"
      - "src/routes/growthAdmin.ts"
      - "src/routes/growthAdminProtected.ts"
      - "src/core/boundedJsonRequest.ts"
      - "src/core/adminAuthentication.ts"
      - "tests/growthAdminFallbackSafety.test.ts"
      - "tests/growthAuditSummary.test.ts"
      - "scripts/check-growth-subhandler-auth-safety.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/growth-fallback-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-fallback-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fallback-safety:
    name: Bounded Growth fallback and reduced audit DTOs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard fallback authentication, bounded writes and audit reduction
        run: node scripts/check-growth-subhandler-auth-safety.mjs

      - name: Run focused fallback and audit tests
        run: node --test tests/growthAdminFallbackSafety.test.ts tests/growthAuditSummary.test.ts

      - name: Typecheck Worker
        run: npm run typecheck
