name: Growth internal operator pack

on:
  pull_request:
    paths:
      - "src/core/growthInternalOperatorPack.ts"
      - "src/core/growthCapabilities.ts"
      - "src/routes/growthInternalOperatorPackAdmin.ts"
      - "src/routes/growthRoutePolicy.ts"
      - "src/index.ts"
      - "tests/growthInternalOperatorPack.test.ts"
      - "tests/growthInternalOperatorPackRouteSource.test.ts"
      - "scripts/check-growth-internal-operator-pack.mjs"
      - "scripts/check-growth-route-policy.mjs"
      - "scripts/check-growth-route-delegates.mjs"
      - "docs/growth-internal-operator-pack.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/growth-internal-operator-pack.yml"
  push:
    branches:
      - main
    paths:
      - "src/core/growthInternalOperatorPack.ts"
      - "src/core/growthCapabilities.ts"
      - "src/routes/growthInternalOperatorPackAdmin.ts"
      - "src/routes/growthRoutePolicy.ts"
      - "src/index.ts"
      - "tests/growthInternalOperatorPack.test.ts"
      - "tests/growthInternalOperatorPackRouteSource.test.ts"
      - "scripts/check-growth-internal-operator-pack.mjs"
      - "scripts/check-growth-route-policy.mjs"
      - "scripts/check-growth-route-delegates.mjs"
      - "docs/growth-internal-operator-pack.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/growth-internal-operator-pack.yml"

permissions:
  contents: read

jobs:
  internal-operator-pack:
    name: Deterministic budgeted operator artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard operator pack contract
        run: node scripts/check-growth-internal-operator-pack.mjs

      - name: Run operator pack tests
        run: node --test tests/growthInternalOperatorPack.test.ts tests/growthInternalOperatorPackRouteSource.test.ts

      - name: Check Growth route policy
        run: npm run growth:route-policy:check

      - name: Check Growth route delegates
        run: npm run growth:route-delegates:check

      - name: Typecheck Worker
        run: npm run typecheck
