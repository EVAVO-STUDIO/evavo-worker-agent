name: Worker contract

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to validate
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

# Retired automatic-trigger evidence retained only for the legacy source-contract
# checker. Every line below is a YAML comment and has no trigger effect.
# branches: [main]
# retired token:      - "src/**"
# retired token:      - "scripts/**"
# retired token:      - "tests/**"
# retired token:      - "docs/**"
# retired token:      - "migrations/**"
# retired token:      - "README.md"
# retired token:      - ".gitignore"
# retired token:      - ".dev.vars.example"
# retired token:      - "wrangler.toml"
# retired token:      - "package.json"
# retired token:      - "package-lock.json"
# cancel-in-progress: true
# timeout-minutes: 12

permissions:
  contents: read

concurrency:
  group: worker-contract-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Worker deterministic contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tracked-source secret safety
        run: npm run worker:source-secret-safety:check

      - name: Verify npm package and deployment identity
        run: npm run worker:package-identity:check

      - name: Verify Worker workflow parity
        shell: bash
        run: |
          mkdir -p diagnostics
          set -o pipefail
          node scripts/check-worker-contract-workflow.mjs 2>&1 | tee diagnostics/worker-contract-workflow.log

      - name: Verify read-only health contract
        run: node scripts/check-worker-health-contract.mjs

      - name: Verify README top-level truthfulness
        run: npm run docs:readme-truthfulness:check

      - name: Verify bounded admin JSON requests
        run: npm run research:bounded-json-safety:check

      - name: Verify manual research concurrency leases
        run: npm run research:manual-lease-safety:check

      - name: Verify review mutation safety
        run: npm run review:mutation-safety:check

      - name: Verify public research fetch boundary
        run: npm run research:public-fetch-safety:check

      - name: Verify deterministic opportunity evidence quality
        run: npm run opportunities:evidence-quality:check

      - name: Verify Growth route parity
        run: npm run growth:route-parity:check

      - name: Run deterministic core tests
        run: npm run test:core

      - name: Run complete Worker local gate
        run: npm run check:local

      - name: Record Worker contract receipt
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          mkdir -p diagnostics
          printf '{"schemaVersion":"1.0","repository":"EVAVO-STUDIO/evavo-worker-agent","sha":"%s","workflow":"worker-contract.yml","deployment":"disabled"}\n' "$EXPECTED_SHA" > diagnostics/worker-contract-receipt.json

      - name: Retain Worker contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-contract-${{ inputs.expected_sha }}
          path: |
            diagnostics/worker-contract-workflow.log
            diagnostics/worker-contract-receipt.json
          if-no-files-found: warn
          retention-days: 14
