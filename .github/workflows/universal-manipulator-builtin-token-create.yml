name: One-time built-in token private repository creation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/universal-manipulator-builtin-token-create.yml"

permissions:
  contents: write

concurrency:
  group: universal-manipulator-builtin-token-create-${{ github.sha }}
  cancel-in-progress: false

jobs:
  create:
    if: github.repository == 'EVAVO-STUDIO/evavo-worker-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Attempt exact private repository creation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "EVAVO-STUDIO/evavo-worker-agent"
          test "${GITHUB_REF}" = "refs/heads/main"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          source_repository = os.environ["GITHUB_REPOSITORY"]
          source_commit = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          target_name = "universal-manipulator"
          target_full_name = "EVAVO-STUDIO/universal-manipulator"
          payload = json.dumps({
              "name": target_name,
              "description": "Governed cross-platform file and repository manipulation toolkit for EVAVO agents.",
              "private": True,
              "has_issues": True,
              "has_projects": False,
              "has_wiki": False,
              "auto_init": False,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/user/repos",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "EVAVO-Universal-Manipulator-bootstrap/1.0",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          status = None
          response_value = {}
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  response_value = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              status = error.code
              try:
                  response_value = json.loads(error.read().decode("utf-8"))
              except Exception:
                  response_value = {"message": "GitHub returned a non-JSON error response."}
          except Exception as error:
              response_value = {
                  "message": f"{type(error).__name__}: repository creation request failed before an HTTP response"
              }

          created = status == 201
          repository = {
              "fullName": response_value.get("full_name"),
              "private": response_value.get("private"),
              "visibility": response_value.get("visibility"),
              "defaultBranch": response_value.get("default_branch"),
          } if created else None
          verified_private = bool(
              created
              and repository["fullName"] == target_full_name
              and repository["private"] is True
              and repository["visibility"] == "private"
          )
          if created and not verified_private:
              raise RuntimeError("GitHub reported creation but the private exact-name boundary failed.")

          safe_message = response_value.get("message")
          if not isinstance(safe_message, str):
              safe_message = None
          elif len(safe_message) > 500:
              safe_message = safe_message[:500]

          receipt = {
              "schemaVersion": 1,
              "kind": "evavo-universal-manipulator-builtin-token-create-receipt",
              "ok": created and verified_private,
              "sourceRepository": source_repository,
              "sourceCommit": source_commit,
              "targetRepository": target_full_name,
              "httpStatus": status,
              "created": created,
              "verifiedPrivate": verified_private,
              "repository": repository,
              "safeMessage": safe_message,
              "boundaries": {
                  "privateOnlyRequested": True,
                  "autoInitRequested": False,
                  "secretValuesDisclosed": False,
                  "forcePushUsed": False,
                  "existingRepositoryModified": False,
              },
          }
          Path("/tmp/receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          receipt_path=".evavo-confirmation/universal-manipulator-builtin-token-create-${GITHUB_SHA}.json"
          content="$(base64 -w0 /tmp/receipt.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}" \
            -f message="ci: record built-in token repository creation result" \
            -f content="${content}" \
            -f branch=main >/dev/null
