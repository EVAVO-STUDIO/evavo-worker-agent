# Historical Cloudflare deployment identifier retained to avoid renaming the live Worker.
# The active public service identity is EVAVO Growth Research Worker.
name = "evavo-outbound-agent"
main = "src/index.ts"
compatibility_date = "2026-02-27"

# Enforce public-only subrequests at the Cloudflare runtime boundary. Active
# research code also validates URLs and every redirect before issuing requests.
compatibility_flags = ["global_fetch_strictly_public"]

# Enable workers.dev URL for controlled deployment verification.
workers_dev = true

# Disable preview URL noise.
preview_urls = false

#################################################
# CRON SCHEDULE
#################################################

# Historical schedules retained for internal-only maintenance.
# Scheduled handlers may synchronise defensive settings, learn from existing
# D1 review metadata and record internal audit events only. They must not fetch
# public sources, discover opportunities, generate drafts or perform external actions.
# Times are UTC.
# 02:15 UTC is approximately 1:15pm Melbourne during AEDT.
triggers = { crons = ["0 * * * *", "15 2 * * *"] }

#################################################
# D1 DATABASE
#################################################

[[d1_databases]]
binding = "DB"
# Historical D1 resource name retained for compatibility with the live database.
# This identifier does not describe an enabled outbound capability.
database_name = "evavo_outbound_agent"
database_id = "45de1891-75df-44ae-9b7e-9a17f139c426"

#################################################
# CLOUDFLARE AI
#################################################

# The binding remains provisioned for compatibility with existing internal
# metadata and diagnostics, but active route and scheduled contracts prohibit
# AI execution.
[ai]
binding = "AI"

#################################################
# ENVIRONMENT VARIABLES
#################################################

[vars]

# Public display name.
PUBLIC_ENGINE_NAME = "EVAVO Growth Research Worker"

# Bounded public-research cap. Drafting and sending have no runtime caps
# because those execution modules and capabilities are absent.
CAP_CRAWL_PER_DAY = "60"

# Lead weighting.
WEIGHT_PARTNER = "1.35"
WEIGHT_REBUILD = "1.0"
WEIGHT_TEARDOWN = "0.9"

# Brand identity.
BRAND_NAME = "EVAVO Studio"
BRAND_DOMAIN = "evavo.com.au"
BRAND_COUNTRIES = "AU,NZ"

#################################################
# SECRETS
#################################################

# Required server-side Worker credential:
# ADMIN_TOKEN

# Optional future private-hub integration value:
# PUBLIC_BASE_URL

# No email-provider secrets are used or accepted by the active Worker source.
