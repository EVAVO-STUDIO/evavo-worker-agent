name: Audio Studio resilient transport probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audio-studio-rgb-transport-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_URL: https://res.cloudinary.com/dntogqtey/image/upload/v1785752486/audio-levels-chunk-00.png
      EXPECTED_CHUNK_SHA256: d6e2d1de749be59d7e25c31959c63ebbd5bd6a3511962a821e3e8efae89693d7
      EXPECTED_CHUNK_BYTES: "149856"
    steps:
      - name: Decode and checksum the error-tolerant pixels
        id: decode
        shell: bash
        run: |
          set -u
          exact=false
          diagnostic=""
          if ! python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 >/tmp/pip.log 2>&1; then
            diagnostic="Decoder dependency installation failed"
          elif ! curl --fail --location --silent --show-error "$IMAGE_URL" --output /tmp/chunk.png 2>/tmp/curl.log; then
            diagnostic="Image download failed"
          else
            python - <<'PY' > /tmp/result.json
          from PIL import Image
          import hashlib, json, os, numpy as np
          try:
              image = Image.open('/tmp/chunk.png').convert('RGB')
              pixels = np.asarray(image, dtype=np.uint8).reshape(-1)
              symbols = np.clip(np.rint(pixels.astype(np.float32) / 85.0), 0, 3).astype(np.uint8)
              usable = symbols[:(symbols.size // 4) * 4].reshape(-1, 4)
              decoded = ((usable[:, 0] << 6) | (usable[:, 1] << 4) | (usable[:, 2] << 2) | usable[:, 3]).astype(np.uint8).tobytes()
              raw = decoded[:int(os.environ['EXPECTED_CHUNK_BYTES'])]
              actual = hashlib.sha256(raw).hexdigest()
              distances = np.abs(pixels.astype(np.int16) - (symbols.astype(np.int16) * 85))
              result = {
                  'schema': 'evavo-audio-studio-resilient-transport-probe-v1',
                  'status': 'passed' if actual == os.environ['EXPECTED_CHUNK_SHA256'] else 'failed',
                  'width': image.width,
                  'height': image.height,
                  'decodedBytes': len(raw),
                  'maximumLevelDistance': int(distances.max()),
                  'meanLevelDistance': float(distances.mean()),
                  'expectedSha256': os.environ['EXPECTED_CHUNK_SHA256'],
                  'actualSha256': actual,
                  'exact': actual == os.environ['EXPECTED_CHUNK_SHA256'],
              }
          except Exception as exc:
              result = {
                  'schema': 'evavo-audio-studio-resilient-transport-probe-v1',
                  'status': 'failed',
                  'exact': False,
                  'diagnostic': f'{type(exc).__name__}: {exc}',
              }
          print(json.dumps(result, indent=2))
          PY
            exact="$(python -c 'import json; print(str(json.load(open("/tmp/result.json"))["exact"]).lower())')"
          fi
          if [ ! -s /tmp/result.json ]; then
            python - "$diagnostic" <<'PY' > /tmp/result.json
          import json, sys
          print(json.dumps({'schema':'evavo-audio-studio-resilient-transport-probe-v1','status':'failed','exact':False,'diagnostic':sys.argv[1]}, indent=2))
          PY
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Publish immutable transport receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt_path=".evavo-confirmation/audio-studio-resilient-probe-${GITHUB_SHA}.json"
          content="$(base64 -w0 /tmp/result.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}" \
            -f message="ci: record Audio Studio resilient transport probe" \
            -f content="$content" \
            -f branch=main >/dev/null

      - name: Enforce byte-exact resilient transport
        if: always()
        shell: bash
        run: test "${{ steps.decode.outputs.exact }}" = "true"
