name: One-time Universal Manipulator publication credential probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/universal-manipulator-publication-credential-probe.yml"

permissions:
  contents: write

concurrency:
  group: universal-manipulator-publication-credential-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'EVAVO-STUDIO/evavo-worker-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_EVAVO_GITHUB_TOKEN: ${{ secrets.EVAVO_GITHUB_TOKEN != '' }}
      HAS_EVAVO_GITHUB_PAT: ${{ secrets.EVAVO_GITHUB_PAT != '' }}
      HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}
      HAS_GITHUB_PAT: ${{ secrets.GITHUB_PAT != '' }}
      HAS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
      HAS_REPO_PAT: ${{ secrets.REPO_PAT != '' }}
      HAS_CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN != '' }}
      HAS_ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN != '' }}
      HAS_GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID != '' }}
      HAS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY != '' }}
      HAS_GH_APP_ID: ${{ secrets.GH_APP_ID != '' }}
      HAS_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY != '' }}
      HAS_EVAVO_GITHUB_APP_ID: ${{ secrets.EVAVO_GITHUB_APP_ID != '' }}
      HAS_EVAVO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.EVAVO_GITHUB_APP_PRIVATE_KEY != '' }}
      HAS_EVAVO_APP_ID: ${{ secrets.EVAVO_APP_ID != '' }}
      HAS_EVAVO_APP_PRIVATE_KEY: ${{ secrets.EVAVO_APP_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact public bootstrap context
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "EVAVO-STUDIO/evavo-worker-agent"
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"

      - name: Publish boolean-only credential receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt_path=".evavo-confirmation/universal-manipulator-credential-probe-${GITHUB_SHA}.json"
          python - <<'PY' > /tmp/receipt.json
          import json
          import os

          names = [
              "HAS_EVAVO_GITHUB_TOKEN",
              "HAS_EVAVO_GITHUB_PAT",
              "HAS_GH_PAT",
              "HAS_GITHUB_PAT",
              "HAS_PERSONAL_ACCESS_TOKEN",
              "HAS_REPO_PAT",
              "HAS_CROSS_REPO_TOKEN",
              "HAS_ORG_GITHUB_TOKEN",
              "HAS_GITHUB_APP_ID",
              "HAS_GITHUB_APP_PRIVATE_KEY",
              "HAS_GH_APP_ID",
              "HAS_GH_APP_PRIVATE_KEY",
              "HAS_EVAVO_GITHUB_APP_ID",
              "HAS_EVAVO_GITHUB_APP_PRIVATE_KEY",
              "HAS_EVAVO_APP_ID",
              "HAS_EVAVO_APP_PRIVATE_KEY",
          ]
          presence = {
              name: os.environ.get(name, "false").lower() == "true"
              for name in names
          }
          result = {
              "schemaVersion": 1,
              "kind": "evavo-universal-manipulator-publication-credential-probe",
              "ok": True,
              "sourceRepository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "credentialPresence": presence,
              "anyUserTokenPresent": any(
                  presence[name]
                  for name in (
                      "HAS_EVAVO_GITHUB_TOKEN",
                      "HAS_EVAVO_GITHUB_PAT",
                      "HAS_GH_PAT",
                      "HAS_GITHUB_PAT",
                      "HAS_PERSONAL_ACCESS_TOKEN",
                      "HAS_REPO_PAT",
                      "HAS_CROSS_REPO_TOKEN",
                      "HAS_ORG_GITHUB_TOKEN",
                  )
              ),
              "anyAppCredentialPairPresent": any(
                  presence[id_name] and presence[key_name]
                  for id_name, key_name in (
                      ("HAS_GITHUB_APP_ID", "HAS_GITHUB_APP_PRIVATE_KEY"),
                      ("HAS_GH_APP_ID", "HAS_GH_APP_PRIVATE_KEY"),
                      ("HAS_EVAVO_GITHUB_APP_ID", "HAS_EVAVO_GITHUB_APP_PRIVATE_KEY"),
                      ("HAS_EVAVO_APP_ID", "HAS_EVAVO_APP_PRIVATE_KEY"),
                  )
              ),
              "boundaries": {
                  "secretValuesDisclosed": False,
                  "privateTargetAccessAttempted": False,
                  "repositoryCreationAttempted": False,
                  "sourceFilesChangedOutsideReceipt": False,
              },
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          content="$(base64 -w0 /tmp/receipt.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}" \
            -f message="ci: record Universal Manipulator credential probe" \
            -f content="${content}" \
            -f branch=main >/dev/null
