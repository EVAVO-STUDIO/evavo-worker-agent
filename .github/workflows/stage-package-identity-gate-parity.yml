name: Stage package identity gate parity

on:
  push:
    branches:
      - work/package-identity-gate-parity-20260727
    paths:
      - ".github/workflows/stage-package-identity-gate-parity.yml"
      - "scripts/stage-package-identity-gate-parity.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-package-identity-gate-parity
  cancel-in-progress: false

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: work/package-identity-gate-parity-20260727
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Build package identity gate parity
        run: node scripts/stage-package-identity-gate-parity.mjs

      - name: Commit staged parity changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No package identity parity changes were required."
            exit 0
          fi
          git commit -m "Stage package identity gate parity"
          git push origin HEAD:work/package-identity-gate-parity-20260727
