name: Worker contract

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - "**/*.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/workflows/worker-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - "**/*.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/workflows/worker-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Worker deterministic contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Worker workflow parity
        run: node scripts/check-worker-contract-workflow.mjs

      - name: Verify read-only health contract
        run: node scripts/check-worker-health-contract.mjs

      - name: Run complete Worker local gate
        run: npm run check:local
