name: Growth Backend Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  growth-backend-check:
    name: Growth backend local contract check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Growth backend aggregate wiring
        run: npm run growth:backend:aggregate:check

      - name: Check Business people docs
        run: npm run business:people:docs:check

      - name: Check Business website page docs
        run: npm run business:website-pages:docs:check

      - name: Print Worker final local gate
        run: npm run worker:final-gate:print

      - name: Run Growth backend aggregate check
        run: npm run growth:backend:check:local

      - name: Print Growth backend validation runbook
        run: npm run growth:backend:final:print
