name: Worker contract

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - ".gitignore"
      - ".dev.vars.example"
      - "**/*.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/worker-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - ".gitignore"
      - ".dev.vars.example"
      - "**/*.ps1"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "wrangler.toml"
      - ".github/dependabot.yml"
      - ".github/workflows/worker-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Worker deterministic contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tracked-source secret safety
        run: npm run worker:source-secret-safety:check

      - name: Verify Worker workflow parity
        run: node scripts/check-worker-contract-workflow.mjs

      - name: Verify read-only health contract
        run: node scripts/check-worker-health-contract.mjs

      - name: Verify README top-level truthfulness
        run: npm run docs:readme-truthfulness:check

      - name: Verify bounded admin JSON requests
        run: npm run research:bounded-json-safety:check

      - name: Verify manual research concurrency leases
        run: npm run research:manual-lease-safety:check

      - name: Verify review mutation safety
        run: npm run review:mutation-safety:check

      - name: Verify public research fetch boundary
        run: npm run research:public-fetch-safety:check

      - name: Verify deterministic opportunity evidence quality
        run: npm run opportunities:evidence-quality:check

      - name: Verify Growth route parity
        run: npm run growth:route-parity:check

      - name: Run deterministic core tests
        run: npm run test:core

      - name: Run complete Worker local gate
        run: npm run check:local
