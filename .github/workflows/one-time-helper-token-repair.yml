name: One-time helper token repair

on:
  push:
    branches: [main]
    paths:
      - ".github/helper-token-repair.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-helper-token-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Repair escaped whitespace contract token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/check-helper-scripts.mjs")
          source = path.read_text(encoding="utf-8")
          old = r'  "/\s/.test(value)",'
          new = r'  "/\\s/.test(value)",'
          old_count = source.count(old)
          new_count = source.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f"HELPER_TOKEN_REPAIR_SCOPE_INVALID:old={old_count}:new={new_count}"
              )
          PY
          grep -Fq '"/\\s/.test(value)"' scripts/check-helper-scripts.mjs
          git diff --check

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify helper and compiler contracts
        run: |
          npm run scripts:check
          npm run typecheck

      - name: Commit verified checker repair and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-helper-token-repair.yml \
            .github/helper-token-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(checks): preserve escaped whitespace token"
          git pull --rebase origin main
          grep -Fq '"/\\s/.test(value)"' scripts/check-helper-scripts.mjs
          npm run scripts:check
          git push origin HEAD:main
