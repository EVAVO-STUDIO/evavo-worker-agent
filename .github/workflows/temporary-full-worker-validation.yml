name: Temporary full Worker main validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "migrations/**"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/temporary-full-worker-validation.yml"

permissions:
  contents: write

concurrency:
  group: temporary-full-worker-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'EVAVO-STUDIO'
    name: Full Worker validation from current main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare focused full-gate fixes
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          failed=0
          python scripts/prepare-full-worker-gate-fixes.py > diagnostics/prepare-base.log 2>&1
          base=$?
          printf '%s\n' "$base" > diagnostics/prepare-base.status
          if [ "$base" -ne 0 ]; then
            failed=1
          else
            while IFS= read -r script; do
              label="$(basename "$script" .py)"
              python "$script" >"diagnostics/${label}.log" 2>&1
              code=$?
              printf '%s\n' "$code" >"diagnostics/${label}.status"
              if [ "$code" -ne 0 ]; then
                failed=1
                break
              fi
            done < <(find scripts -maxdepth 1 -type f -name 'refine-full-worker-*.py' | sort)
          fi
          exit "$failed"

      - name: Collect full validation diagnostics
        if: always()
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          failed=0

          run_check() {
            label="$1"
            shift
            log="diagnostics/${label}.log"
            "$@" >"$log" 2>&1
            code=$?
            printf '%s\n' "$code" >"diagnostics/${label}.status"
            if [ "$code" -ne 0 ]; then
              failed=1
              echo "FAIL $label"
            else
              echo "PASS $label"
            fi
          }

          if [ "${{ steps.prepare.outcome }}" != "success" ]; then
            failed=1
            echo "FAIL preparation"
          else
            run_check helper-guard node scripts/check-helper-scripts.mjs
            run_check safety-completeness node scripts/check-safety-gate-completeness.mjs
            run_check operating-posture node scripts/check-readme-operating-posture.mjs
            run_check broad-admin node scripts/check-broad-admin-write-safety.mjs
            run_check autonomy-capability node scripts/check-autonomy-capability-truthfulness.mjs
            run_check worker-workflow-guard node scripts/check-worker-contract-workflow.mjs
            run_check activity-budget node scripts/check-growth-activity-budget.mjs
            run_check zero-cost node scripts/check-growth-zero-cost-envelope.mjs
            run_check route-parity node scripts/check-growth-route-parity.mjs
            run_check focused-tests npm run test:core -- \
              tests/growthActivityBudgetSettings.test.ts \
              tests/growthActivityBudgetSource.test.ts \
              tests/growthInternalOperatorPackRouteSource.test.ts \
              tests/growthRouteParitySource.test.ts \
              tests/growthZeroCostEnvelope.test.ts \
              tests/opportunitySourceHealthActionsSource.test.ts
            run_check core-tests npm run test:core
            run_check backend-aggregate npm run growth:backend:aggregate:check
            run_check local-gate npm run check:local
            run_check typecheck npm run typecheck
          fi

          git diff --name-only | sort > diagnostics/candidate-files.txt
          git diff --stat > diagnostics/candidate-stat.txt
          git diff > diagnostics/candidate.patch

          {
            echo "validated_main_sha=${{ github.event.pull_request.base.sha }}"
            echo "prepare_outcome=${{ steps.prepare.outcome }}"
            echo "full_validation_failed=$failed"
            for status in diagnostics/*.status; do
              printf '%s=%s\n' "$(basename "$status" .status)" "$(cat "$status")"
            done
          } | tee diagnostics/summary.txt
          exit "$failed"

      - name: Publish clean validated commits
        if: steps.prepare.outcome == 'success' && steps.diagnostics.outcome == 'success'
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLISH_BRANCH: validated/full-worker-gates-${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"

          publish="$RUNNER_TEMP/full-worker-publish"
          git worktree add --detach "$publish" origin/main
          python "$GITHUB_WORKSPACE/scripts/prepare-full-worker-gate-fixes.py" "$publish"
          while IFS= read -r script; do
            python "$GITHUB_WORKSPACE/$script" "$publish"
          done < <(find scripts -maxdepth 1 -type f -name 'refine-full-worker-*.py' | sort)
          cd "$publish"
          git switch -c "$PUBLISH_BRANCH"

          expected="$(sort -u "$GITHUB_WORKSPACE/scripts/full-worker-publish-files.txt")"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/core/growthZeroCostEnvelope.ts scripts/check-growth-zero-cost-envelope.mjs
          git commit -m "Fix Growth zero-cost safety floor evaluation"

          git add \
            src/core/growthCapabilities.ts \
            docs/manual-research-concurrency.md \
            scripts/check-growth-activity-budget.mjs \
            tests/growthActivityBudgetSettings.test.ts \
            tests/growthActivityBudgetSource.test.ts \
            tests/growthInternalOperatorPackRouteSource.test.ts
          git commit -m "Align Growth activity contracts with live runtime"

          git add -A
          git commit -m "Align Worker meta-guards with guarded runtime"

          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          {
            echo "publish_branch=$PUBLISH_BRANCH"
            echo "parent_sha=$(git rev-parse HEAD^^^)"
            echo "final_sha=$(git rev-parse HEAD)"
            echo "changed_files<<EOF"
            printf '%s\n' "$actual"
            echo "EOF"
          } | tee "$GITHUB_WORKSPACE/diagnostics/published-commit.txt"

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: temporary-full-worker-main-validation
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Fail when validation failed
        if: always()
        shell: bash
        run: |
          test -f diagnostics/summary.txt
          grep -q '^full_validation_failed=0$' diagnostics/summary.txt
