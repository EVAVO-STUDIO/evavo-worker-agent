name: Sentinel repository admission (read-only)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current default-branch commit SHA to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-admission-${{ github.repository }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  inventory:
    name: Collect exact architecture and repair-admission evidence
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SENTINEL_REPORT: ${{ runner.temp }}/sentinel/repository-admission.json

    steps:
      - name: Validate exact default-branch authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$SOURCE_SHA"
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

      - name: Check out the exact source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Prove checked-out identity and pristine starting state
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" "origin/$DEFAULT_BRANCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up isolated inventory runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Collect repository-native architecture and validation evidence
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SENTINEL_REPORT")"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const root = process.env.GITHUB_WORKSPACE;
          const exists = (relativePath) => fs.existsSync(path.join(root, relativePath));
          const rootEntries = fs.readdirSync(root, { withFileTypes: true });
          const rootFiles = rootEntries.filter((entry) => entry.isFile()).map((entry) => entry.name);
          const matchingRootFiles = (pattern) => rootFiles.filter((name) => pattern.test(name)).sort();

          let packageManifest = null;
          let packageManifestError = null;
          if (exists("package.json")) {
            try {
              packageManifest = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            } catch (error) {
              packageManifestError = error instanceof Error ? error.message : String(error);
            }
          }

          const scripts = packageManifest && typeof packageManifest.scripts === "object"
            ? packageManifest.scripts
            : {};
          const validationNames = ["verify", "check", "typecheck", "lint", "test", "build"];
          const nativeValidation = Object.fromEntries(
            Object.entries(scripts)
              .filter(([name, command]) =>
                validationNames.some((prefix) => name === prefix || name.startsWith(`${prefix}:`)) &&
                typeof command === "string",
              )
              .sort(([left], [right]) => left.localeCompare(right)),
          );

          const architectureSignals = {
            node: ["package.json"].filter(exists),
            monorepo: ["pnpm-workspace.yaml", "turbo.json", "nx.json", "lerna.json"].filter(exists),
            python: ["pyproject.toml", "requirements.txt", "setup.py", "uv.lock", "poetry.lock"].filter(exists),
            rust: ["Cargo.toml", "Cargo.lock"].filter(exists),
            go: ["go.mod", "go.sum"].filter(exists),
            godot: ["project.godot"].filter(exists),
            dotnet: [...matchingRootFiles(/\.(sln|csproj|fsproj)$/i)],
            java: ["pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts"].filter(exists),
            php: ["composer.json", "composer.lock"].filter(exists),
            ruby: ["Gemfile", "Gemfile.lock"].filter(exists),
            swift: ["Package.swift"].filter(exists),
            dart: ["pubspec.yaml", "pubspec.lock"].filter(exists),
            unity: ["ProjectSettings/ProjectVersion.txt"].filter(exists),
            unreal: matchingRootFiles(/\.uproject$/i),
            containers: ["Dockerfile", "compose.yaml", "compose.yml", "docker-compose.yml"].filter(exists),
          };

          const lockfiles = [
            "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb",
            "uv.lock", "poetry.lock", "Pipfile.lock", "Cargo.lock", "go.sum", "composer.lock", "Gemfile.lock",
          ].filter(exists);
          const legacyRuntimeFiles = [
            ".sentinel/sentinel-orchestrator.js",
            ".sentinel/ENHANCED_SENTINEL_V6.js",
            ".sentinel/MASTER_MASS_ANALYSIS.js",
          ].filter(exists);
          const detectedArchitectures = Object.entries(architectureSignals)
            .filter(([, evidence]) => evidence.length > 0)
            .map(([name]) => name);

          const report = {
            schemaVersion: "evavo.sentinel.repository-admission.v1",
            repository: process.env.GITHUB_REPOSITORY,
            source: {
              branch: process.env.DEFAULT_BRANCH,
              sha: process.env.EXPECTED_SHA,
              workflowRunId: process.env.GITHUB_RUN_ID,
            },
            outcome: packageManifestError
              ? "blocked-invalid-package-manifest"
              : "inventory-ready-repository-specific-repair-not-authorized",
            architecture: {
              detected: detectedArchitectures,
              evidence: architectureSignals,
              packageManager: packageManifest?.packageManager ?? null,
              nodeEngines: packageManifest?.engines ?? null,
              lockfiles,
            },
            validation: {
              repositoryNativeScripts: nativeValidation,
              commandsExecuted: [],
              reason: "Admission inventories commands but never executes repository code or guesses a toolchain.",
            },
            legacy: {
              runtimeFiles: legacyRuntimeFiles,
              broadAutomaticMutationQuarantined: true,
            },
            repairPolicy: {
              sourceMutation: "forbidden-in-admission",
              automaticCommit: false,
              automaticPush: false,
              forcePush: false,
              stylingOrAssetChanges: false,
              requirements: [
                "exact failing evidence and first-cause diagnosis",
                "repository-specific architecture and toolchain plan",
                "bounded candidate paths with protected product surfaces",
                "pre-change and post-change validation",
                "atomic rollback and separately authorized publication",
              ],
            },
            packageManifestError,
          };

          fs.writeFileSync(process.env.SENTINEL_REPORT, `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Prove admission did not mutate the repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Summarize bounded admission evidence
        if: always()
        shell: bash
        run: |
          if [ -f "$SENTINEL_REPORT" ]; then
            node -e 'const r=require(process.env.SENTINEL_REPORT); console.log(`## Sentinel repository admission\n\n- Outcome: ${r.outcome}\n- Architectures: ${r.architecture.detected.join(", ") || "unclassified"}\n- Source mutation: forbidden\n- Automatic commit/push: disabled`)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-repository-admission-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/sentinel/repository-admission.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: Reject malformed root package metadata
        if: always()
        shell: bash
        run: |
          if [ -f "$SENTINEL_REPORT" ]; then
            node -e 'const r=require(process.env.SENTINEL_REPORT); if (r.packageManifestError) { console.error(r.packageManifestError); process.exit(1); }'
          fi
