name: Growth zero-cost source selection

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit SHA to validate
        required: true
        type: string
      request_source:
        description: Governed dispatcher identity
        required: true
        default: evavo-development-studio
        type: string

permissions:
  contents: read

concurrency:
  group: growth-zero-cost-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  source-selection:
    name: Source budget and adaptive selection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate dispatch input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_SOURCE: ${{ inputs.request_source }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected_sha" >&2
            exit 1
          fi
          if [[ "$REQUEST_SOURCE" != "evavo-development-studio" ]]; then
            echo "Unsupported request_source" >&2
            exit 1
          fi

      - name: Check out exact mainline commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify exact repository toolchain
        run: node scripts/check-repository-toolchain.mjs

      - name: Run repository toolchain adversarial fixtures
        run: node scripts/test-repository-toolchain.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Guard zero-cost activity and ledger contracts
        run: node scripts/check-growth-activity-budget.mjs

      - name: Exercise source capacity and selection contracts
        run: node --test tests/growthActivityBudgetSettings.test.ts tests/opportunitySourceSelection.test.ts

      - name: Type-check Worker integration
        run: npm run typecheck

      - name: Record source-selection receipt
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          mkdir -p diagnostics
          printf '{"schemaVersion":"1.0","repository":"EVAVO-STUDIO/evavo-worker-agent","sha":"%s","workflow":"growth-zero-cost-source-selection.yml","externalSpend":"disabled","deployment":"disabled"}\n' "$EXPECTED_SHA" > diagnostics/growth-zero-cost-receipt.json

      - name: Upload bounded source-selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: growth-zero-cost-${{ inputs.expected_sha }}
          path: diagnostics/growth-zero-cost-receipt.json
          if-no-files-found: error
          retention-days: 14
